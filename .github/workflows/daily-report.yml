name: 每日盘前评分报告

on:
  # ===== schedule 已暂停 (2026-09-14) =====
  # 恢复定时运行：取消下方 4 行注释即可重新启用 9:00/12:00 自动运行
  # schedule:
  #   # 北京时间每天9:00（盘前, 美股隔夜数据）和12:00（午盘, 日韩数据补充）
  #   - cron: '0 1 * * 1-5'
  #   - cron: '0 4 * * 1-5'
  workflow_dispatch:  # 支持手动触发

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy

      - name: Run scoring engine
        id: engine
        run: |
          python3 unified_scoring_engine.py 2>&1 || true
          # 检查是否生成了报告
          if ls output/unified_*.html 1>/dev/null 2>&1; then
            echo "report_generated=true" >> $GITHUB_OUTPUT
            echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
            echo "✅ 报告生成成功"
          else
            echo "report_generated=false" >> $GITHUB_OUTPUT
            echo "❌ 报告生成失败"
          fi

      - name: Send email with retry
        if: steps.engine.outputs.report_generated == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python3 -c "
          import os, smtplib, glob, time, sys
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import datetime

          date_str = datetime.now().strftime('%Y-%m-%d')
          host = os.environ.get('SMTP_HOST', '')
          port = int(os.environ.get('SMTP_PORT', '465'))
          user = os.environ.get('SMTP_USER', '')
          passwd = os.environ.get('SMTP_PASS', '')
          to = os.environ.get('EMAIL_TO', '')

          if not all([host, user, passwd, to]):
              print('❌ 邮件配置缺失，请检查 Secrets: SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASS/EMAIL_TO')
              sys.exit(1)

          # 找报告文件
          html_files = sorted(glob.glob('output/unified_*.html'))
          if not html_files:
              print('❌ 未找到报告文件')
              sys.exit(1)

          html_file = html_files[-1]
          json_files = sorted(glob.glob('output/unified_*.json'))

          with open(html_file, 'r', encoding='utf-8') as f:
              html_content = f.read()

          # 构建邮件
          msg = MIMEMultipart('alternative')
          msg['From'] = user
          msg['To'] = to
          msg['Subject'] = f'统一评分日报 {date_str}（{"盘前" if datetime.now().hour < 11 else "午盘"}更新）'

          # HTML body（截断到安全的闭合点）
          if len(html_content) > 300000:
              # 找到最后一个</table>或</div>截断
              cut = html_content[:300000]
              for tag in ['</tbody></table>', '</table>', '</div>']:
                  idx = cut.rfind(tag)
                  if idx > 0:
                      cut = cut[:idx + len(tag)]
                      break
              html_content_body = cut + '<p style=\"text-align:center;color:#999;padding:20px\">完整报告见附件</p>'
          else:
              html_content_body = html_content

          msg.attach(MIMEText(html_content_body, 'html', 'utf-8'))

          # 附件：完整HTML
          with open(html_file, 'rb') as f:
              part = MIMEBase('application', 'octet-stream')
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header('Content-Disposition', f'attachment; filename=unified_{date_str}.html')
              msg.attach(part)

          # 附件：JSON
          if json_files:
              with open(json_files[-1], 'rb') as f:
                  part = MIMEBase('application', 'octet-stream')
                  part.set_payload(f.read())
                  encoders.encode_base64(part)
                  part.add_header('Content-Disposition', f'attachment; filename=unified_{date_str}.json')
                  msg.attach(part)

          # 重试发送（最多3次）
          max_retries = 3
          for attempt in range(1, max_retries + 1):
              try:
                  print(f'  尝试发送 #{attempt}/{max_retries}...')
                  if port == 465:
                      server = smtplib.SMTP_SSL(host, port, timeout=30)
                  else:
                      server = smtplib.SMTP(host, port, timeout=30)
                      server.starttls()
                  server.login(user, passwd)
                  recipients = [r.strip() for r in to.split(',')]
                  server.sendmail(user, recipients, msg.as_string())
                  server.quit()
                  print(f'✅ 邮件发送成功！收件人: {to}')
                  sys.exit(0)
              except smtplib.SMTPAuthenticationError as e:
                  print(f'❌ 认证失败: {e}')
                  print('   请检查 SMTP_USER 和 SMTP_PASS（QQ邮箱用授权码不是密码）')
                  sys.exit(1)
              except smtplib.SMTPException as e:
                  print(f'❌ SMTP错误(尝试{attempt}): {e}')
              except Exception as e:
                  print(f'❌ 发送失败(尝试{attempt}): {e}')
              
              if attempt < max_retries:
                  wait = 10 * attempt
                  print(f'   等待{wait}秒后重试...')
                  time.sleep(wait)

          print(f'❌ {max_retries}次重试均失败')
          print('   排查清单:')
          print('   1. 检查 GitHub Secrets 是否正确配置')
          print('   2. QQ邮箱授权码是否过期（每90天需重新生成）')
          print('   3. SMTP服务器是否可用')
          print('   4. 收件邮箱是否拦截了发件人')
          sys.exit(1)
          "

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ steps.engine.outputs.date }}
          path: output/
          retention-days: 30

      - name: Check result
        if: always()
        run: |
          echo "=== 运行结果 ==="
          echo "报告生成: ${{ steps.engine.outputs.report_generated }}"
          if [ "${{ steps.engine.outputs.report_generated }}" != "true" ]; then
            echo "❌ 报告未生成，检查上方日志"
            exit 1
          fi
          echo "✅ 流程完成"
